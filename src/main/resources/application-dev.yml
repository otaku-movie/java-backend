  endpoint: ${STORAGE_ENDPOINT:https://fc57c8ebc7f4ac0ad80e7f84cb52fd1d.r2.cloudflarestorage.com}
  access-key: ${STORAGE_ACCESS_KEY:352312287d2794bd1803567b457ac343}
  secret-key: ${STORAGE_SECRET_KEY:5824d818abe4ea0eb7dc744581e53dfea94b94fb4cd27500c1cc98644cd1e487}
  region: ${STORAGE_REGION:auto}
  bucket: ${STORAGE_BUCKET:test-movie}
