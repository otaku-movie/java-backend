# App 启动页配置：运营可在这里换图换文案，App 启动时从 /api/app/splash/current 拉取。
# 后续若要做无发版热更新（不重启后端），可把这块配置迁移到 DB 表 app_splash_config，
# 仍然走 AppSplashController 出口。
app:
  splash:
    image-url: ${APP_SPLASH_IMAGE_URL:}
    title-en: ${APP_SPLASH_TITLE_EN:Otaku Movie}
    title-zh: ${APP_SPLASH_TITLE_ZH:Otaku Movie}
    title-ja: ${APP_SPLASH_TITLE_JA:Otaku Movie}
    subtitle-en: ${APP_SPLASH_SUBTITLE_EN:Anime movies, in one tap}
    subtitle-zh: ${APP_SPLASH_SUBTITLE_ZH:动漫电影，一键直达}
    subtitle-ja: ${APP_SPLASH_SUBTITLE_JA:アニメ映画をワンタップで}
    min-duration-ms: ${APP_SPLASH_MIN_MS:1500}
    max-duration-ms: ${APP_SPLASH_MAX_MS:3500}
    tap-action: ${APP_SPLASH_TAP_ACTION:}
logging:
  level:
    root: INFO
    com.example.backend: INFO
    org.springframework: INFO
    org.springframework.web: INFO
    org.springframework.boot: INFO
    org.springframework.context: INFO
    org.hibernate: WARN
    com.zaxxer.hikari: INFO
    # 本地未启动 RabbitMQ 时会持续重连刷屏；需要排查 MQ 时临时改回 WARN/INFO。
    org.springframework.amqp.rabbit.connection.CachingConnectionFactory: OFF
    org.springframework.amqp.rabbit.listener.SimpleMessageListenerContainer: OFF
    # p6spy SQL 日志：默认 OFF（完全不打印 SQL），排查 SQL 时临时改回 INFO
    p6spy: OFF
    # 关闭 MyBatis 默认的 SQL 输出（使用 p6spy 输出）
    org.mybatis: WARN
    org.apache.ibatis: WARN
    com.baomidou.mybatisplus: WARN
  # 控制台 / 文件输出格式统一由 logback-spring.xml 控制（含彩色），此处不再覆盖 console pattern，
  # 否则无色的 console pattern 会盖掉 logback 里的彩色配置。
  exception-conversion-word: "%wEx"