spring:
  datasource:
    # 使用 PostgreSQL 官方 JDBC 驱动（42.7.3，支持 PostgreSQL 17）
    driver-class-name: org.postgresql.Driver
    # Docker 环境可通过 SPRING_DATASOURCE_URL 覆盖，本地默认连接 localhost
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/test_movie?useUnicode=true&characterEncoding=UTF-8&useSSL=false&stringtype=unspecified&reWriteBatchedInserts=true&currentSchema=public}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgre}
  data:
    redis:
      # Docker 环境使用容器服务名，本地开发使用 localhost
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: 0
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  rabbitmq:
    # Docker 环境使用容器服务名，本地开发使用 localhost
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
  servlet:
    multipart:
      # 请求最大大小 不设置会报错
      max-request-size: -1
      # 文件上传最大大小
      max-file-size: -1
  server:
    tomcat:
      max-swallow-size: -1
      max-http-form-post-size: -1
    port: 8080
    address: 0.0.0.0
# 旧 minio.* 已迁移到 storage.*；保留 block 仅为兼容历史 MinioConfiguration bean，
# 同源从 storage.* 注入；凭证仅通过环境变量注入
minio:
  endpoint: ${STORAGE_ENDPOINT:}
  accessKey: ${STORAGE_ACCESS_KEY:}
  secretKey: ${STORAGE_SECRET_KEY:}
  bucket: ${STORAGE_BUCKET:test-movie}
  previewURL: ${STORAGE_PUBLIC_URL:https://images.otaku-movie.com}

# Cloudflare R2（S3 兼容）配置
# - endpoint：R2 控制台的「S3 API」终结点（默认已填）
# - bucket：R2 控制台的 bucket 名（默认 test-movie）
# - region：R2 必须使用 auto
# - path-style-access：R2 推荐 false（virtual-host 风格）
# - public-url：r2.dev 公开域名 或 自定义域名（需在 R2 控制台单独开启 / 绑定）
# - access-key / secret-key：仅通过环境变量传入，不写入文件
storage:
  endpoint: ${STORAGE_ENDPOINT:https://fc57c8ebc7f4ac0ad80e7f84cb52fd1d.r2.cloudflarestorage.com}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}
  region: ${STORAGE_REGION:auto}
  bucket: ${STORAGE_BUCKET:test-movie}
  public-url: ${STORAGE_PUBLIC_URL:https://images.otaku-movie.com}
  path-style-access: ${STORAGE_PATH_STYLE:false}
logging:
  level:
    root: INFO
    com.example.backend: DEBUG
    org.springframework: INFO
    org.springframework.web: DEBUG
    org.springframework.boot: INFO
    org.springframework.context: INFO
    org.hibernate: DEBUG
    com.zaxxer.hikari: DEBUG
    # p6spy SQL 日志输出（输出完整的 SQL，参数已填充）
    p6spy: INFO
    # 关闭 MyBatis 默认的 SQL 输出（使用 p6spy 输出）
    org.mybatis: WARN
    org.apache.ibatis: WARN
    com.baomidou.mybatisplus: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  exception-conversion-word: "%wEx"