spring:
  output:
    ansi:
      # IDE 调试控制台有时不会被识别为支持 ANSI；强制开启，保证 logback 彩色输出生效。
      enabled: always
  devtools:
    restart:
      # DevTools restart 会重建 Spring 容器；第三方库/手写线程池若未绑定销毁逻辑，
      # 长时间开发会累积旧线程并耗尽 JVM 原生内存。默认关闭，可按需用环境变量打开。
      enabled: ${SPRING_DEVTOOLS_RESTART_ENABLED:false}
    livereload:
      # 关闭 LiveReload Server 线程；后端接口开发一般不依赖它，需要时可用环境变量打开。
      enabled: ${SPRING_DEVTOOLS_LIVERELOAD_ENABLED:false}
  datasource:
    # 使用 PostgreSQL 官方 JDBC 驱动（42.7.3，支持 PostgreSQL 17）
    driver-class-name: org.postgresql.Driver
    # Docker 环境可通过 SPRING_DATASOURCE_URL 覆盖，本地默认连接 localhost
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/test_movie?useUnicode=true&characterEncoding=UTF-8&useSSL=false&stringtype=unspecified&reWriteBatchedInserts=true&currentSchema=crawl}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgre}
    # HikariCP：dashboard 一次需要并发 19 条聚合 SQL，默认 10 连接会让请求被分成 2 批。
    # 调到 20 后单次冷请求里这些 SQL 可以真正同时跑。
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
  data:
    redis:
      # Docker 环境使用容器服务名，本地开发使用 localhost
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: 0
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  rabbitmq:
    # Docker 环境使用容器服务名，本地开发使用 localhost
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
  servlet:
    multipart:
      # 请求最大大小 不设置会报错
      max-request-size: -1
      # 文件上传最大大小
      max-file-size: -1
  server:
    tomcat:
      max-swallow-size: -1
      max-http-form-post-size: -1
    port: 8080
    address: 0.0.0.0
